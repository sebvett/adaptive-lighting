# https://www.home-assistant.io/integrations/default_config/
default_config:

# https://www.home-assistant.io/integrations/logger/
logger:
  default: info
  logs:
    custom_components.adaptive_lighting: debug

# State backends for virtual lights (optimistic templates need these to report
# brightness / color temp back to Adaptive Lighting).
input_boolean:
  smart_bulb_a:
    name: Smart Bulb A power
  smart_bulb_b:
    name: Smart Bulb B power
  smart_plug:
    name: Smart Plug power

input_number:
  smart_bulb_a_brightness:
    name: Smart Bulb A brightness
    min: 0
    max: 255
    step: 1
    initial: 128
  smart_bulb_b_brightness:
    name: Smart Bulb B brightness
    min: 0
    max: 255
    step: 1
    initial: 128
  smart_bulb_a_color_temp:
    name: Smart Bulb A color temp (mireds)
    min: 153
    max: 500
    step: 1
    initial: 300
  smart_bulb_b_color_temp:
    name: Smart Bulb B color temp (mireds)
    min: 153
    max: 500
    step: 1
    initial: 300

# Two dimmable + color-temperature smart lights, plus one binary plug-as-light.
light:
  - platform: template
    lights:
      smart_bulb_a:
        friendly_name: "Smart Bulb A"
        unique_id: debug_smart_bulb_a
        value_template: "{{ is_state('input_boolean.smart_bulb_a', 'on') }}"
        level_template: "{{ states('input_number.smart_bulb_a_brightness') | int }}"
        temperature_template: "{{ states('input_number.smart_bulb_a_color_temp') | int }}"
        min_mireds_template: "{{ 153 }}"
        max_mireds_template: "{{ 500 }}"
        supports_transition_template: "{{ true }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.smart_bulb_a
          - action: input_number.set_value
            target:
              entity_id: input_number.smart_bulb_a_brightness
            data:
              value: "{{ brightness | default(255) }}"
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.smart_bulb_a
        set_level:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.smart_bulb_a
          - action: input_number.set_value
            target:
              entity_id: input_number.smart_bulb_a_brightness
            data:
              value: "{{ brightness }}"
        set_temperature:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.smart_bulb_a
          - action: input_number.set_value
            target:
              entity_id: input_number.smart_bulb_a_color_temp
            data:
              value: "{{ color_temp }}"
          - action: input_number.set_value
            target:
              entity_id: input_number.smart_bulb_a_brightness
            data:
              value: "{{ brightness | default(states('input_number.smart_bulb_a_brightness')) }}"

      smart_bulb_b:
        friendly_name: "Smart Bulb B"
        unique_id: debug_smart_bulb_b
        value_template: "{{ is_state('input_boolean.smart_bulb_b', 'on') }}"
        level_template: "{{ states('input_number.smart_bulb_b_brightness') | int }}"
        temperature_template: "{{ states('input_number.smart_bulb_b_color_temp') | int }}"
        min_mireds_template: "{{ 153 }}"
        max_mireds_template: "{{ 500 }}"
        supports_transition_template: "{{ true }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.smart_bulb_b
          - action: input_number.set_value
            target:
              entity_id: input_number.smart_bulb_b_brightness
            data:
              value: "{{ brightness | default(255) }}"
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.smart_bulb_b
        set_level:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.smart_bulb_b
          - action: input_number.set_value
            target:
              entity_id: input_number.smart_bulb_b_brightness
            data:
              value: "{{ brightness }}"
        set_temperature:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.smart_bulb_b
          - action: input_number.set_value
            target:
              entity_id: input_number.smart_bulb_b_color_temp
            data:
              value: "{{ color_temp }}"
          - action: input_number.set_value
            target:
              entity_id: input_number.smart_bulb_b_brightness
            data:
              value: "{{ brightness | default(states('input_number.smart_bulb_b_brightness')) }}"

      # Smart plug exposed as a light: on/off only (no brightness / color temp).
      smart_plug:
        friendly_name: "Smart Plug"
        unique_id: debug_smart_plug
        value_template: "{{ is_state('input_boolean.smart_plug', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.smart_plug
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.smart_plug
